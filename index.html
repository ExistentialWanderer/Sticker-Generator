<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Label Generator</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f4f4f4; }
        input, select { padding: 5px; box-sizing: border-box; }
        input[type="number"] { width: 70px; }
        .btn { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 10px 20px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover { background: #0056b3; }
        hr { margin: 30px 0; border: 0; border-top: 1px solid #ccc; }

        /* 🖨️ NATIVE PRINTING STYLING (PORTED FROM YOUR EJS STYLE BLOCK) */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page { size: A4; margin: 0; }
            
            /* Hide web UI completely */
            h1, p, table, .btn, hr, h3, form { display: none !important; }
            body { margin: 0; padding: 0; background-color: #fff; }
            
            #sticker-print-area { display: block !important; }

            .page {
                display: grid;
                grid-template-columns: 99.1mm 99.1mm;
                grid-template-rows: repeat(4, 67.7mm);
                justify-content: center;
                align-content: start;
                page-break-after: always;
                break-after: page;
                padding-top: 13mm;
                box-sizing: border-box;
            }

            .label {
                width: 99.1mm;
                height: 67.7mm;
                padding: 6mm;
                box-sizing: border-box;
                border: 0.1mm solid #eee; /* Light guide line */
                display: flex;
                flex-direction: column;
                color: #000;
                font-family: Arial, sans-serif;
            }

            .header { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 1mm; }
            .logo-container { height: 20mm; margin-right: 4mm; }
            .logo-container img { height: 100%; object-fit: contain; }
            .company-contact { text-align: left; }
            .company-name { font-size: 18pt; font-weight: 900; line-height: 1; margin: 0; }
            .company-tel { font-size: 11pt; font-weight: bold; margin-top: 1mm; }
            .divider { border-top: 0.8mm solid #000; margin-bottom: 2mm; }
            .product-title { font-size: 16pt; font-weight: 800; text-align: center; margin-bottom: 3mm; }
            .data-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 11pt; line-height: 1.4; }
            .data-right { text-align: right; }
            .allergen-warning { margin-top: 3mm; font-size: 10pt; font-weight: bold; text-transform: uppercase; }
        }
        
        /* Hide print layout elements on user's computer screen view */
        #sticker-print-area { display: none; }
    </style>
</head>
<body>
    <h1>Castle Brewery Label Generator</h1>
    <p>Enter details and the number of stickers needed for each batch:</p>
    
    <form id="labelForm" onsubmit="event.preventDefault();">
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Batch</th>
                    <th>Container</th>
                    <th>Best Before</th>
                    <th>Volume / % / Gross</th>
                    <th>Allergens</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody id="product-table-body">
                <!-- Rows injected dynamically by JavaScript -->
            </tbody>
        </table>
        
        <button type="button" onclick="addRow()" class="btn">+ Add Row</button>
        <button type="button" onclick="generateNativePrint()" class="btn" style="background-color: #28a745;">🖨️ Generate & Print Stickers</button>
    </form>
    
    <hr>
    <h3>Add Batch</h3>
    <form id="addBatchForm" onsubmit="addBatch(event)">
        <select id="add_product_select" required>
            <option value="">-- Select Product --</option>
        </select>
        <input type="text" id="newBatch" placeholder="New Batch Number" required>
        <button type="submit" class="btn">Add to Library</button>
    </form>

    <h3>Delete Old Batch</h3>
    <form id="deleteBatchForm" onsubmit="deleteBatch(event)">
        <select id="delete_product_select" onchange="updateDeleteDropdown(this.value)" required>
            <option value="">-- Select Product --</option>
        </select>
        <select id="delete_batch_select" required>
            <option value="">-- Select Batch --</option>
        </select>
        <button type="submit" class="btn" style="background-color: #ff4444; color: white;">Delete from Library</button>
    </form>

    <!-- Hidden block for native A4 dynamic page layouts -->
    <div id="sticker-print-area"></div>
    
    <script>
        // Setup your asset configurations or convert an image asset to a Base64 string for standalone usage
        const LOGO_SRC = "logo.png"; 

        // Product library configuration profiles including old metadata parameters
        let defaultLibrary = {
            "Best Bitter": { batches: ["B102", "B103"], volume: "500ml", percentage: "4.2", gross: "500ml", allergens: "BARLEY" },
            "Gold Ale": { batches: ["G50", "G51"], volume: "500ml", percentage: "3.8", gross: "500ml", allergens: "WHEAT, BARLEY" }
        };
        let defaultContainers = { "Bottle": {}, "Cask": {}, "Keg": {} };

        let library = JSON.parse(localStorage.getItem('stickerLibrary')) || defaultLibrary;
        let containers = JSON.parse(localStorage.getItem('stickerContainers')) || defaultContainers;
        let rowCount = 0;

        function saveLibrary() {
            localStorage.setItem('stickerLibrary', JSON.stringify(library));
            populateProductDropdowns();
        }
        
        function updateBatches(rowId, selectedName) {
            const batchDropdown = document.getElementById('batch_select_' + rowId);
            if (!batchDropdown) return;
            batchDropdown.innerHTML = '';

            const row = document.getElementById(`row_${rowId}`);
            
            if (selectedName && library[selectedName]) {
                const prod = library[selectedName];
                // Autofill other layout data columns based on product default keys
                row.querySelector('input[name="volume"]').value = prod.volume || '';
                row.querySelector('input[name="percentage"]').value = prod.percentage || '';
                row.querySelector('input[name="gross"]').value = prod.gross || '';
                row.querySelector('input[name="allergens"]').value = prod.allergens || '';

                prod.batches.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b; opt.textContent = b;
                    batchDropdown.appendChild(opt);
                });
            } else {
                const opt = document.createElement('option');
                opt.textContent = "Select product first";
                batchDropdown.appendChild(opt);
            }
        }
        
        function addRow() {
            rowCount++;
            const tbody = document.getElementById('product-table-body');
            const row = document.createElement('tr');
            row.id = `row_${rowCount}`;
            
            row.innerHTML = `
                <td>
                    <select name="productName" class="prod-select" onchange="updateBatches('${rowCount}', this.value)">
                        <option value="">-- Select --</option>
                        ${Object.keys(library).map(name => `<option value="${name}">${name}</option>`).join('')}
                    </select>
                </td>
                <td><select id="batch_select_${rowCount}" name="batch"><option value="">Select product first</option></select></td>
                <td><select name="container">${Object.keys(containers).map(c => `<option value="${c}">${c}</option>`).join('')}</select></td>
                <td><input type="date" name="bbDate"></td>
                <td>
                    <input type="text" name="volume" placeholder="Vol" style="width:55px;">
                    <input type="text" name="percentage" placeholder="%" style="width:40px;">
                    <input type="text" name="gross" placeholder="Gross" style="width:55px;">
                </td>
                <td><input type="text" name="allergens" placeholder="Allergens"></td>
                <td><input type="number" name="qty" value="0" min="0"></td>
            `;
            tbody.appendChild(row);
        }

        function populateProductDropdowns() {
            const addSelect = document.getElementById('add_product_select');
            const deleteSelect = document.getElementById('delete_product_select');
            const optionsHtml = '<option value="">-- Select Product --</option>' + Object.keys(library).map(name => `<option value="${name}">${name}</option>`).join('');
            addSelect.innerHTML = optionsHtml;
            deleteSelect.innerHTML = optionsHtml;
        }

                function updateDeleteDropdown(productName) {
            const deleteSelect = document.getElementById('delete_batch_select');
            deleteSelect.innerHTML = '<option value="">-- Select Batch --</option>';
            if (productName && library[productName]) {
                library[productName].batches.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b; opt.textContent = b;
                    deleteSelect.appendChild(opt);
                });
            }
        }

        function addBatch(e) {
            e.preventDefault();
            const product = document.getElementById('add_product_select').value;
            const batchNum = document.getElementById('newBatch').value.trim();
            if (product && batchNum && !library[product].batches.includes(batchNum)) {
                library[product].batches.push(batchNum);
                saveLibrary();
                document.getElementById('newBatch').value = '';
                alert(`Added batch ${batchNum} to ${product}`);
            }
        }

        function deleteBatch(e) {
            e.preventDefault();
            const product = document.getElementById('delete_product_select').value;
            const batchToDelete = document.getElementById('delete_batch_select').value;
            if (confirm('Are you sure you want to delete this batch?')) {
                library[product].batches = library[product].batches.filter(b => b !== batchToDelete);
                saveLibrary();
                updateDeleteDropdown(product);
                alert('Batch removed successfully.');
            }
        }

        // Generates the layout, builds dynamic 8-per-page blocks, then executes printing
        function generateNativePrint() {
            const printArea = document.getElementById('sticker-print-area');
            printArea.innerHTML = ''; 
            
            const rows = document.querySelectorAll('#product-table-body tr');
            let labelItemsArray = [];

            // 1. Gather up all structural items manually designated in rows
            rows.forEach(row => {
                const productName = row.querySelector('select[name="productName"]').value;
                if (!productName) return;

                const qty = parseInt(row.querySelector('input[name="qty"]').value) || 0;
                if (qty <= 0) return;

                const batch = row.querySelector('select[name="batch"]').value;
                const container = row.querySelector('select[name="container"]').value;
                const bbDate = row.querySelector('input[name="bbDate"]').value;
                
                const volume = row.querySelector('input[name="volume"]').value;
                const percentage = row.querySelector('input[name="percentage"]').value;
                const gross = row.querySelector('input[name="gross"]').value;
                const allergens = row.querySelector('input[name="allergens"]').value;

                // Push an individual object tracking configuration for each requested sticker clone
                for (let i = 0; i < qty; i++) {
                    labelItemsArray.push({
                        name: productName,
                        batch: batch || 'TBC',
                        containerName: container || 'Unit',
                        bestBefore: bbDate || 'See Cap',
                        volume: volume,
                        percentage: percentage,
                        gross: gross || volume,
                        allergens: allergens
                    });
                }
            });

            if (labelItemsArray.length === 0) {
                alert('Please configure at least one label row with a quantity greater than 0.');
                return;
            }

            // 2. Map structures precisely in batches of 8 items per container view block
            for (let i = 0; i < labelItemsArray.length; i += 8) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';

                const currentSlice = labelItemsArray.slice(i, i + 8);
                currentSlice.forEach(item => {
                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'label';
                    labelDiv.innerHTML = `
                        <div class="header">
                            <div class="logo-container">
                                <img src="${LOGO_SRC}" alt="Logo" onerror="this.style.display='none'">
                            </div>
                            <div class="company-contact">
                                <div class="company-name">Castle Brewery</div>
                                <div class="company-tel">Tel: 07778 565963</div>
                            </div>
                        </div>
                        <div class="divider"></div>
                        <div class="product-title">
                            ${item.name} - ${item.containerName}
                        </div>
                        <div class="data-grid">
                            <div class="data-left">
                                <div>Batch: ${item.batch}</div>
                                <div>Taxable: ${item.volume}</div>
                                <div>ALC: ${item.percentage}% Vol</div>
                            </div>
                            <div class="data-right">
                                <div>Best before: ${item.bestBefore}</div>
                                <div>Gross: ${item.gross}</div>
                            </div>
                        </div>
                        <div class="allergen-warning">
                            Contains ${item.allergens}
                        </div>
                    `;
                    pageDiv.appendChild(labelDiv);
                });

                printArea.appendChild(pageDiv);
            }

            // 3. Launch native printing dialog wrapper
            window.print();
        }
    
        window.addEventListener('DOMContentLoaded', () => {
            populateProductDropdowns();
            addRow(); 
        });
